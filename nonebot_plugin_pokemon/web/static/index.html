<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>宝可梦 · QWeb</title>
<style>
  :root {
    --bg: #070b14;
    --panel: rgba(18, 25, 40, .78);
    --panel-solid: #121928;
    --line: rgba(120, 160, 230, .18);
    --text: #e8efff;
    --muted: #9fb0cf;
    --accent: #6fb1ff;
    --accent2: #7de2c3;
    --warn: #ffd166;
    --danger: #ff7b8a;
    --shadow: 0 18px 60px rgba(0, 0, 0, .45);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
    color: var(--text);
    background:
      radial-gradient(1200px 700px at 18% -10%, rgba(77, 130, 255, .28), transparent 60%),
      radial-gradient(900px 600px at 100% 0%, rgba(83, 226, 190, .16), transparent 55%),
      linear-gradient(160deg, #050810 0%, #0a1020 45%, #070b14 100%);
    overflow: hidden;
  }
  body::before {
    content: "";
    position: fixed; inset: -10%;
    background-image:
      linear-gradient(rgba(120, 160, 230, .05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120, 160, 230, .05) 1px, transparent 1px);
    background-size: 46px 46px;
    transform: perspective(700px) rotateX(58deg) translateY(22%);
    pointer-events: none;
    opacity: .5;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .app {
    position: relative;
    display: grid;
    grid-template-rows: 64px 1fr;
    height: 100%;
    padding: 14px 18px 18px;
    gap: 12px;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 8px;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .ball {
    width: 34px; height: 34px; border-radius: 50%;
    background: linear-gradient(180deg, #ff5d6c 0 47%, #f4f7ff 47% 53%, #e8efff 53% 100%);
    border: 2px solid rgba(255, 255, 255, .75);
    box-shadow: 0 0 24px rgba(111, 177, 255, .45);
    position: relative;
  }
  .ball::after {
    content: ""; position: absolute; left: 50%; top: 50%;
    width: 11px; height: 11px; border-radius: 50%;
    transform: translate(-50%, -50%);
    background: #0b1220; border: 2px solid #fff;
  }
  .brand h1 { font-size: 19px; margin: 0; letter-spacing: .08em; }
  .brand small { color: var(--muted); letter-spacing: .12em; }
  .head-right { display: flex; align-items: center; gap: 10px; }
  .chip {
    padding: 7px 11px; border-radius: 999px; border: 1px solid var(--line);
    background: rgba(20, 30, 50, .7); color: var(--muted); font-size: 12px;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .chip strong { color: var(--text); font-weight: 600; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent2); box-shadow: 0 0 8px var(--accent2); }
  .dot.off { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
  main {
    display: grid;
    grid-template-columns: 292px minmax(0, 1fr);
    gap: 14px;
    min-height: 0;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(18px);
    min-height: 0;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .panel-head {
    padding: 14px 16px 10px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid rgba(120, 160, 230, .1);
  }
  .panel-head h2 { margin: 0; font-size: 14px; letter-spacing: .12em; color: #cfe0ff; font-weight: 600; }
  .panel-body { padding: 14px 16px; overflow: auto; min-height: 0; }
  .panel-body::-webkit-scrollbar, .console::-webkit-scrollbar { width: 8px; }
  .panel-body::-webkit-scrollbar-thumb, .console::-webkit-scrollbar-thumb { background: rgba(120,160,230,.22); border-radius: 8px; }

  /* left */
  .trainer { padding: 16px; border-bottom: 1px solid rgba(120,160,230,.1); }
  .trainer .name { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .trainer .sub { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 13px; }
  .stat {
    padding: 9px 10px; border-radius: 12px; border: 1px solid rgba(120,160,230,.13);
    background: rgba(10, 16, 28, .5);
  }
  .stat span { display: block; font-size: 11px; color: var(--muted); }
  .stat b { font-size: 15px; color: #eaf1ff; }
  .team-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .poke-pill {
    padding: 4px 8px; border-radius: 8px; background: rgba(111,177,255,.12);
    border: 1px solid rgba(111,177,255,.25); font-size: 11px; color: #cfe0ff;
  }
  .section-title { font-size: 11px; color: var(--muted); letter-spacing: .18em; margin: 16px 0 8px; }
  .search {
    width: 100%; padding: 9px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: rgba(8, 13, 24, .7); outline: none;
  }
  .search:focus { border-color: rgba(111,177,255,.55); }
  .menu-list { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .menu-cat { margin-top: 10px; }
  .menu-cat > summary {
    cursor: pointer; list-style: none; color: #bcd1f5; font-size: 12px;
    padding: 7px 8px; border-radius: 8px; background: rgba(111,177,255,.07);
    display: flex; justify-content: space-between;
  }
  .menu-cat > summary::-webkit-details-marker { display: none; }
  .menu-item {
    width: 100%; text-align: left; border: 0; background: transparent;
    padding: 7px 9px; border-radius: 8px; color: var(--text); font-size: 12px;
    display: flex; justify-content: space-between; gap: 8px;
  }
  .menu-item:hover { background: rgba(111,177,255,.12); }
  .menu-item span { color: var(--muted); font-size: 10px; white-space: nowrap; }

  /* center */
  .center { display: grid; grid-template-rows: auto 1fr; }
  .tabs { display: flex; gap: 6px; padding: 12px 14px 0; }
  .tab {
    border: 1px solid transparent; background: transparent; color: var(--muted);
    padding: 8px 13px; border-radius: 10px; font-size: 13px;
  }
  .tab.active { color: #eff6ff; background: rgba(111,177,255,.14); border-color: rgba(111,177,255,.25); }
  .view { min-height: 0; display: none; flex-direction: column; }
  .view.active { display: flex; }
  .console {
    flex: 1; overflow: auto; padding: 16px 18px 6px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .msg { display: flex; gap: 9px; align-items: flex-start; animation: rise .18s ease-out; }
  @keyframes rise { from { transform: translateY(5px); opacity: 0; } to { transform: none; opacity: 1; } }
  .avatar {
    width: 30px; height: 30px; border-radius: 10px; flex: 0 0 30px;
    background: linear-gradient(135deg, rgba(111,177,255,.35), rgba(125,226,195,.2));
    border: 1px solid rgba(111,177,255,.32);
    display: grid; place-items: center; font-size: 13px;
  }
  .bubble {
    max-width: min(720px, 92%);
    background: rgba(17, 26, 43, .82);
    border: 1px solid rgba(120,160,230,.14);
    border-radius: 4px 14px 14px 14px;
    padding: 10px 13px; line-height: 1.62; font-size: 13.5px;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.me { flex-direction: row-reverse; }
  .msg.me .bubble {
    border-radius: 14px 4px 14px 14px;
    background: linear-gradient(135deg, rgba(58, 110, 210, .55), rgba(40, 82, 160, .6));
    border-color: rgba(111,177,255,.3);
  }
  .bubble img { max-width: 100%; border-radius: 10px; margin-top: 7px; display: block; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tag {
    font-size: 11px; color: #bcd1f5; border: 1px solid rgba(120,160,230,.24);
    background: rgba(111,177,255,.09); padding: 3px 7px; border-radius: 6px;
  }
  .composer { padding: 10px 14px 14px; border-top: 1px solid rgba(120,160,230,.1); }
  .quick { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .quick button {
    border: 1px solid rgba(120,160,230,.22); background: rgba(111,177,255,.08);
    color: #cfe0ff; border-radius: 8px; padding: 5px 9px; font-size: 11px;
  }
  .quick button:hover { background: rgba(111,177,255,.18); }
  .input-row { display: flex; gap: 8px; align-items: flex-end; }
  .input-row textarea {
    flex: 1; resize: none; min-height: 42px; max-height: 120px;
    padding: 11px 13px; border-radius: 12px; border: 1px solid var(--line);
    background: rgba(7, 12, 22, .8); outline: none; line-height: 1.45;
  }
  .input-row textarea:focus { border-color: rgba(111,177,255,.55); }
  .send {
    border: 0; border-radius: 12px; padding: 11px 18px; font-weight: 600;
    background: linear-gradient(135deg, #5d9cff, #4f78d8); color: #fff;
    box-shadow: 0 8px 22px rgba(80, 140, 255, .28);
  }
  .send:disabled { opacity: .5; box-shadow: none; }
  .hint { font-size: 11px; color: var(--muted); margin-top: 7px; display: flex; justify-content: space-between; gap: 8px; }
  .hint b { color: var(--warn); font-weight: 500; }

  /* data views */
  .data-wrap { padding: 16px 18px; overflow: auto; }
  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .kpi { padding: 12px; border-radius: 12px; background: rgba(12, 20, 34, .65); border: 1px solid rgba(120,160,230,.14); }
  .kpi span { font-size: 11px; color: var(--muted); }
  .kpi b { display: block; margin-top: 4px; font-size: 19px; }
  .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
  .chart-card { border: 1px solid rgba(120,160,230,.14); border-radius: 12px; overflow: hidden; background: rgba(9, 14, 24, .6); }
  .chart-card img { width: 100%; display: block; }
  .chart-card h3 { margin: 0; padding: 10px 12px; font-size: 12px; color: #cfe0ff; font-weight: 500; border-bottom: 1px solid rgba(120,160,230,.1); }
  .rank-list { display: flex; flex-direction: column; gap: 5px; margin-top: 10px; }
  .rank { display: flex; justify-content: space-between; padding: 7px 10px; border-radius: 8px; background: rgba(111,177,255,.06); font-size: 12px; }
  .rank i { color: var(--accent); font-style: normal; width: 24px; }
  .dex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; margin-top: 12px; }
  .dex-card { padding: 11px; border-radius: 11px; background: rgba(12, 20, 34, .7); border: 1px solid rgba(120,160,230,.14); cursor: pointer; }
  .dex-card:hover { border-color: rgba(111,177,255,.5); }
  .dex-card b { font-size: 13px; }
  .dex-card span { display: block; color: var(--muted); font-size: 11px; margin-top: 3px; }
  .editable { border-bottom: 1px dashed rgba(125,226,195,.5); cursor: text; }
  .err { color: var(--danger); }
  .muted { color: var(--muted); }
  @media (max-width: 1180px) {
    main { grid-template-columns: 250px minmax(0, 1fr); }
  }
  @media (max-width: 820px) {
    body { overflow: auto; }
    .app { height: auto; grid-template-rows: auto 1fr; }
    main { grid-template-columns: 1fr; }
    .left { display: none; }
    .console { min-height: 45vh; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="ball"></div>
      <div>
        <h1>宝可梦 · QWeb</h1>
        <small>NONEBOT2 / ONEBOT 11·12 / QQ OFFICIAL</small>
      </div>
    </div>
    <div class="head-right">
      <div class="chip">训练家 <strong id="who">网页玩家</strong><span id="admin-badge"></span></div>
    </div>
  </header>

  <main>
    <aside class="panel left">
      <div class="trainer">
        <div class="name"><span id="nickname">未开局</span><span class="chip" id="title-chip"></span></div>
        <div class="sub" id="place">尚未领取初始精灵</div>
        <div class="stat-grid">
          <div class="stat"><span>金币</span><b id="score">0</b></div>
          <div class="stat"><span>声望</span><b id="rep">0</b></div>
          <div class="stat"><span>宝可梦</span><b id="poke-count">0</b></div>
          <div class="stat"><span>试炼塔</span><b id="dungeon">0</b></div>
        </div>
        <div class="team-row" id="team-row"></div>
      </div>
      <div class="panel-body">
        <div class="section-title">快速指令</div>
        <div class="quick" id="quick-commands"></div>
        <div class="section-title">功能目录</div>
        <input class="search" id="menu-search" placeholder="搜索功能，例如 对战 / 初始精灵">
        <div id="menu-list" class="menu-list"></div>
      </div>
    </aside>

    <section class="panel center">
      <div class="tabs">
        <button class="tab active" data-view="adventure">冒险</button>
        <button class="tab" data-view="dex">图鉴</button>
        <button class="tab" data-view="analytics">数据分析</button>
        <button class="tab" data-view="admin" id="tab-admin" style="display:none">管理</button>
      </div>
      <div class="view active" id="view-adventure">
        <div class="console" id="console"></div>
        <div class="composer">
          <div class="quick" id="context-buttons"></div>
          <div class="input-row">
            <textarea id="command-input" rows="1" placeholder="输入指令，例如：野外探索 / 精灵状态 小火龙 / 前往 1号道路"></textarea>
            <button class="send" id="send-command">发送</button>
          </div>
          <div class="hint"><span>提示：战斗/小游戏会进入连续交互，期间输入将作为选项提交。</span><b id="awaiting-hint"></b></div>
        </div>
      </div>
      <div class="view" id="view-dex">
        <div class="data-wrap">
          <div class="input-row">
            <input class="search" id="dex-search" placeholder="搜索宝可梦名称或编号，例如 皮卡丘 / 25">
          </div>
          <div class="dex-grid" id="dex-grid"></div>
          <div id="dex-detail"></div>
        </div>
      </div>
      <div class="view" id="view-admin">
        <div class="data-wrap">
          <div class="kpi-grid" id="admin-kpis"></div>
          <div class="section-title">自动化</div>
          <div class="rank-list" id="admin-jobs"></div>
          <div class="quick" style="margin-top:14px">
            <button id="admin-download">下载全部素材</button>
            <button id="admin-reload">重载菜单与工具</button>
            <button id="admin-refresh">刷新状态</button>
          </div>
          <p class="muted" style="line-height:1.8">管理接口位于 <code>/api/admin/*</code>；身份与管理员角色由宿主 <code>src.qi_web.dependencies</code> 校验，页面只携带 <code>X-CSRF-Token</code>。</p>
        </div>
      </div>
      <div class="view" id="view-analytics">
        <div class="data-wrap">
          <div class="kpi-grid" id="kpis"></div>
          <div class="chart-grid" id="player-charts"></div>
          <div class="section-title">排行榜</div>
          <div class="rank-list" id="rank-list"></div>
          <div class="chart-grid" id="global-charts"></div>
        </div>
      </div>
    </section>
  </main>
</div>

<script>
(() => {
  const BASE = (window.__POKEMON_BASE__ || location.pathname.replace(/\/+$/, "") || "/qweb/pokemon").replace(/\/+$/, "");
  const $ = (sel) => document.querySelector(sel);

  async function csrfToken() {
    const response = await fetch("/qweb/api/v1/auth/session", { credentials: "same-origin", cache: "no-store" });
    if (!response.ok) throw new Error("无法读取登录会话");
    const session = await response.json();
    if (!session.csrf_token) throw new Error("请登录七七");
    return session.csrf_token;
  }

  let userName = "";
  let awaiting = false;
  let menuData = null;

  async function api(path, options) {
    const opts = Object.assign({}, options || {});
    opts.headers = { "Content-Type": "application/json", ...opts.headers };
    if (!["GET", "HEAD"].includes((opts.method || "GET").toUpperCase())) {
      opts.headers["X-CSRF-Token"] = await csrfToken();
    }
    const response = await fetch(BASE + path, opts);
    const text = await response.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch (_) { data = { text }; }
    if (!response.ok) {
      throw new Error((data && (data.detail || data.error)) || ("HTTP " + response.status));
    }
    return data;
  }

  function esc(text) {
    return String(text == null ? "" : text).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  }

  function addMessage(who, content, buttons, images) {
    const wrap = document.createElement("div");
    wrap.className = "msg " + (who === "me" ? "me" : "");
    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = who === "me" ? "我" : "宝";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML = esc(content || "").replace(/\n/g, "<br>");
    (images || []).forEach((src) => {
      const img = document.createElement("img");
      img.src = src;
      img.alt = "游戏图片";
      bubble.appendChild(img);
    });
    (buttons || []).forEach((btn, index) => {
      const action = btn.data || btn.text;
      let tag;
      if (btn.action === 0 || /^https?:\/\//.test(action)) {
        tag = document.createElement("a");
        tag.href = action;
        tag.target = "_blank";
        tag.rel = "noopener noreferrer";
      } else {
        tag = document.createElement("button");
        tag.onclick = () => sendCommand(action);
      }
      tag.className = "tag";
      tag.textContent = btn.text || action;
      tag.title = action || "";
      tag.style.marginRight = "6px";
      bubble.appendChild(tag);
    });
    wrap.appendChild(avatar);
    wrap.appendChild(bubble);
    $("#console").appendChild(wrap);
    $("#console").scrollTop = $("#console").scrollHeight;
  }

  function renderResult(result) {
    const messages = result.messages || [];
    if (!messages.length) {
      if (result.error) addMessage("bot", "⚠ " + result.error);

      return;
    }
    messages.forEach((msg) => {
      const segments = msg.segments || [];
      const text = segments.filter((s) => s.type === "text" && s.data).map((s) => s.data).join("");
      const images = segments.filter((s) => s.type === "image" && s.data).map((s) => s.data);
      if (text || images.length) addMessage("bot", text, result.buttons || [], images);
    });
    if (result.error) addMessage("bot", "⚠ " + result.error);
  }

  async function followResult(result) {
    while (true) {
      if (result.superseded) return;
      renderResult(result);
      awaiting = !!result.awaiting;
      updateAwaiting();
      if (awaiting || result.done || result.error) return;
      await new Promise(resolve => setTimeout(resolve, 750));
      const params = new URLSearchParams({ operation: result.operation, offset: String(result.offset) });
      result = await api("/api/session?" + params);
    }
  }

  async function sendCommand(text) {
    text = String(text || "").trim();
    if (!text) return;
    addMessage("me", text);
    $("#command-input").value = "";
    $("#send-command").disabled = true;
    try {
      const result = await api("/api/command", {
        method: "POST",
        body: JSON.stringify({ text }),
      });
      await followResult(result);
      await refreshProfile();
    } catch (err) {
      addMessage("bot", "⚠ " + err.message);
    } finally {
      $("#send-command").disabled = false;
      $("#command-input").focus();
    }
  }

  function updateAwaiting() {
    $("#awaiting-hint").textContent = awaiting ? "等待你的选择… 可点击上方按钮或输入内容" : "";
    const cancel = $("#cancel-interaction");
    if (!cancel) {
      const btn = document.createElement("button");
      btn.id = "cancel-interaction";
      btn.className = "tag";
      btn.textContent = "取消连续交互";
      btn.onclick = async () => {
        await api("/api/cancel", { method: "POST", body: "{}" });
        awaiting = false;
        updateAwaiting();
        addMessage("bot", "已取消当前连续交互。");
      };
      $("#context-buttons").appendChild(btn);
    }
    cancel && (cancel.style.display = awaiting ? "inline-block" : "none");
  }

  async function refreshProfile() {
    try {
      const data = await api("/api/bootstrap");
      const p = data.profile;
      const identity = data.identity || {};
      userName = identity.user_name || p.nickname || "";
      $("#nickname").textContent = p.nickname || "未开局";
      $("#who").textContent = userName || "网页玩家";
      $("#admin-badge").textContent = identity.is_admin ? " · 管理员" : "";
      const adminTab = $("#tab-admin");
      if (adminTab) adminTab.style.display = identity.is_admin ? "" : "none";
      $("#title-chip").textContent = p.title || "";
      $("#place").textContent = p.score ? (p.region ? p.region + " · " : "") + (p.map || "未知地点") : "尚未领取初始精灵";
      $("#score").textContent = p.score;
      $("#rep").textContent = p.reputation;
      $("#poke-count").textContent = p.pokemon_count;
      $("#dungeon").textContent = p.dungeon_floor;
      const row = $("#team-row");
      row.innerHTML = "";
      (p.team || []).forEach((m) => {
        const pill = document.createElement("span");
        pill.className = "poke-pill";
        pill.textContent = m.name + " Lv." + m.level;
        pill.title = (m.types || []).join("/");
        row.appendChild(pill);
      });
    } catch (err) {
      $("#who").textContent = "身份未通过宿主校验";
    }
  }

  function renderMenu() {
    if (!menuData) return;
    const root = $("#menu-list");
    root.innerHTML = "";
    const categories = menuData.categories || {};
    Object.keys(categories).forEach((category) => {
      const detail = document.createElement("details");
      detail.className = "menu-cat";
      detail.open = category === "基础" || category === "养成";
      const summary = document.createElement("summary");
      summary.innerHTML = "<span>" + esc(category) + "</span><span>" + categories[category].length + "</span>";
      detail.appendChild(summary);
      categories[category].forEach((item) => {
        if (item.pmn_hidden) return;
        const btn = document.createElement("button");
        btn.className = "menu-item";
        btn.innerHTML = "<b>" + esc(item.func) + "</b><span>" + esc(item.trigger_method || "") + "</span>";
        btn.title = item.brief_des || "";
        btn.onclick = () => {
          const trigger = (item.trigger_method || "").replace(/[`]/g, "");
          const first = trigger.split(" / ")[0].trim();
          if (first.includes("...") || first.includes(" ")) {
            $("#command-input").value = first.replace(/\.\.\./g, " ");
            $("#command-input").focus();
          } else {
            sendCommand(first);
          }
        };
        detail.appendChild(btn);
      });
      root.appendChild(detail);
    });
  }

  async function loadMenu(query) {
    const data = await api("/api/menu" + (query ? "?q=" + encodeURIComponent(query) : ""));
    menuData = data;
    renderMenu();
  }

  async function loadDex(query) {
    const grid = $("#dex-grid");
    $("#dex-detail").innerHTML = "";
    if (!query) { grid.innerHTML = '<span class="muted">输入名称或编号开始搜索，例如 皮卡丘。</span>'; return; }
    try {
      const data = await api("/api/pokedex?q=" + encodeURIComponent(query));
      grid.innerHTML = "";
      (data.items || []).forEach((item) => {
        const card = document.createElement("div");
        card.className = "dex-card";
        card.innerHTML = "<b>#" + item.id + " " + esc(item.name) + "</b><span>" + esc((item.types || []).join(" / ")) + " · 种族值 " + item.base_total + "</span>";
        card.onclick = () => showDex(item.name);
        grid.appendChild(card);
      });
      if (!(data.items || []).length) grid.innerHTML = '<span class="muted">没有找到。</span>';
    } catch (err) { grid.innerHTML = '<span class="err">' + esc(err.message) + "</span>"; }
  }

  async function showDex(name) {
    try {
      const data = await api("/api/pokedex?name=" + encodeURIComponent(name));
      const e = data.entry;
      const stats = Object.entries(e.base_stats).map(([k, v]) => {
        const width = Math.min(100, v / 1.8);
        return '<div style="margin:6px 0"><span class="muted">' + esc(k) + " " + v + '</span><div style="height:6px;border-radius:6px;background:rgba(120,160,230,.14)"><div style="height:6px;width:' + width + '%;border-radius:6px;background:linear-gradient(90deg,#6fb1ff,#7de2c3)"></div></div></div>';
      }).join("");
      $("#dex-detail").innerHTML = '<div class="panel" style="margin-top:14px;padding:16px"><h2 style="margin:0 0 8px">' + esc(e.name) + " <span class='muted'>#" + e.id + "</span></h2><div class='muted'>" + esc((e.types || []).join(" / ")) + " · 种族值总和 " + e.base_total + "</div>" + stats + '<p style="line-height:1.7;color:#cfe0ff">' + esc(e.description) + "</p></div>";
    } catch (err) { $("#dex-detail").innerHTML = '<span class="err">' + esc(err.message) + "</span>"; }
  }

  async function loadAnalytics() {
    try {
      const overview = await api("/api/analytics/overview");
      const kpis = [
        ["训练家", overview.players],
        ["宝可梦记录", overview.pokemon_records],
        ["平均等级", overview.average_level],
        ["平均金币", overview.average_score],
      ];
      $("#kpis").innerHTML = kpis.map(([k, v]) => '<div class="kpi"><span>' + k + "</span><b>" + v + "</b></div>").join("");
      const stamp = "?t=" + Date.now();
      const charts = ["team_radar", "team_levels", "team_types"];
      $("#player-charts").innerHTML = charts.map((kind) => '<div class="chart-card"><h3>' + kind + '</h3><img src="' + BASE + "/api/charts/" + kind + stamp + '" alt="' + kind + '"></div>').join("");
      const globals = ["popular_species", "level_distribution"];
      $("#global-charts").innerHTML = globals.map((kind) => '<div class="chart-card"><h3>' + kind + '</h3><img src="' + BASE + "/api/charts/" + kind + stamp + '" alt="' + kind + '"></div>').join("");
      const rank = await api("/api/leaderboard/score");
      $("#rank-list").innerHTML = (rank.items || []).map((item, i) => '<div class="rank"><span><i>' + (i + 1) + "</i>" + esc(item.nickname) + "</span><b>" + item.score + "</b></div>").join("");
    } catch (err) { $("#rank-list").innerHTML = '<span class="err">' + esc(err.message) + "</span>"; }
  }

  async function loadAdmin() {
    try {
      const data = await api("/api/admin/state");
      const kpis = [
        ["数据目录", data.data_dir],
        ["图标", data.icons],
        ["闪光图标", data.star_icons],
        ["菜单条目", data.menu_entries],
        ["玩家", data.players],
        ["宝可梦记录", data.pokemon_records],
        ["工具注册", data.tools_registered ? "是" : "否"],
        ["网页会话", data.web_sessions],
      ];
      $("#admin-kpis").innerHTML = kpis.map(([k, v]) => '<div class="kpi"><span>' + k + "</span><b style='font-size:13px'>" + esc(v) + "</b></div>").join("");
      $("#admin-jobs").innerHTML = (data.scheduler_jobs || []).map((name) => '<div class="rank"><span>' + esc(name) + "</span><b>定时</b></div>").join("") || '<span class="muted">没有定时任务</span>';
    } catch (err) {
      $("#admin-kpis").innerHTML = '<span class="err">' + esc(err.message) + "</span>";
    }
  }

  // events
  document.querySelectorAll(".tab").forEach((tab) => {
    tab.onclick = () => {
      document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", t === tab));
      document.querySelectorAll(".view").forEach((v) => v.classList.toggle("active", v.id === "view-" + tab.dataset.view));
      if (tab.dataset.view === "analytics") loadAnalytics();
      if (tab.dataset.view === "admin") loadAdmin();
      if (tab.dataset.view === "dex") loadDex($("#dex-search").value.trim());
    };
  });
  $("#send-command").onclick = () => sendCommand($("#command-input").value);
  $("#command-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendCommand($("#command-input").value); }
  });
  $("#menu-search").addEventListener("input", (e) => loadMenu(e.target.value.trim()));
  $("#dex-search").addEventListener("input", (e) => loadDex(e.target.value.trim()));
  $("#admin-refresh").onclick = loadAdmin;
  $("#admin-download").onclick = async () => {
    try {
      await api("/api/admin/resource/download", { method: "POST", body: "{}" });
      addMessage("bot", "已开始后台下载全部素材，完成后日志会显示结果。");
    } catch (err) { addMessage("bot", "⚠ " + err.message); }
  };
  $("#admin-reload").onclick = async () => {
    try {
      const r = await api("/api/admin/reload", { method: "POST", body: "{}" });
      addMessage("bot", "已重载菜单与工具：" + (r.tools_registered ? "工具已注册" : "MoEllmChats 未安装或名称冲突"));
    } catch (err) { addMessage("bot", "⚠ " + err.message); }
  };

  (async () => {
    addMessage("bot", "欢迎来到宝可梦网页版。先发送 `领取初始精灵 小火龙` 开局，或点击左侧功能目录。");
    await refreshProfile();
    await loadMenu("");
    const current = await api("/api/session");
    if (current.operation) await followResult(current);
    const quick = ["宝可梦帮助", "领取初始精灵 小火龙", "我的精灵列表", "野外探索", "精灵状态 小火龙", "查看地图"];
    $("#quick-commands").innerHTML = "";
    quick.forEach((text) => {
      const btn = document.createElement("button");
      btn.textContent = text;
      btn.onclick = () => sendCommand(text);
      $("#quick-commands").appendChild(btn);
    });
    setInterval(refreshProfile, 60000);
  })();
})();
</script>
</body>
</html>

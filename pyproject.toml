[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "nonebot-plugin-pokemon"
version = "1.0.0"
description = "宝可梦养成/探索/对战/道具/小游戏 NoneBot2 插件，支持 OneBot v11、OneBot v12、QQ 官方机器人、PicMenu Next、MoEllmChats 与 QWeb 网页游玩"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [
  { name = "jiluoQAQ", email = "376148946@qq.com" },
  { name = "LoCCai" },
]
keywords = ["nonebot", "nonebot2", "pokemon", "qq", "onebot", "qweb", "llm", "picmenu"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]
dependencies = [
  "nonebot2>=2.0.0",
  "pillow>=9.5.0",
  "aiosqlite>=0.19.0",
  "httpx>=0.24.0",
  "pytz>=2023.3",
  "async-timeout>=4.0.2",
  "aiofiles>=23.1.0",
  "pygtrie>=2.5.0",
  "tomli>=2.0.1; python_version<'3.11'",
]

[project.optional-dependencies]
onebot11 = ["nonebot-adapter-onebot>=2.4.0"]
onebot12 = ["nonebot-adapter-onebot>=2.4.0"]
qq = ["nonebot-adapter-qq>=1.4.0"]
charts = ["matplotlib>=3.7.0"]
picmenu = ["nonebot-plugin-picmenu-next>=0.5.0"]
moellm = ["nonebot-plugin-moellmchats>=0.26.0"]
web = ["fastapi>=0.100.0", "uvicorn>=0.23.0"]
all = [
  "nonebot-adapter-onebot>=2.4.0",
  "nonebot-adapter-qq>=1.4.0",
  "matplotlib>=3.7.0",
  "nonebot-plugin-picmenu-next>=0.5.0",
  "fastapi>=0.100.0",
  "uvicorn>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["nonebot_plugin_pokemon"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
  "nonebot_plugin_pokemon/Pokemon",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E402", "F403", "F405", "F401"]